name: giveaway-monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: giveaway-monitor
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytchat requests
      - run: python giveaway_monitor.py
        env:
          ONESHOT: "1"
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
